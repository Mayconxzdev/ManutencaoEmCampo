name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências essenciais
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-core.txt pytest
      - name: Validar sintaxe
        run: python -m compileall -q backend/app backend/scripts
      - name: Executar testes da demonstração
        working-directory: backend
        run: pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar backend isolado para os testes de navegador
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-core.txt
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=120000
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build de produção
        working-directory: frontend
        run: npm run build
      - name: Instalar navegador para testes de fluxo
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Testar fluxos de navegador
        working-directory: frontend
        env:
          MEC_E2E_PYTHON: python
        run: npm run test:e2e
