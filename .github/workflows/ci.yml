name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências essenciais
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-core.txt pytest
      - name: Validar sintaxe
        run: python -m compileall -q backend/app backend/scripts
      - name: Executar testes da demonstração
        working-directory: backend
        run: pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Mantém a CI alinhada com a versão indicada para avaliação local.
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          # O lockfile público resolve pacotes do npmjs. Declarar o registro
          # evita que um proxy herdado faça uma verificação pública falhar.
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar backend isolado para os testes de navegador
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-core.txt
      - name: Instalar dependências para qualidade e build
        working-directory: frontend
        env:
          # Sobrescreve qualquer configuração herdada pelo runner neste passo.
          npm_config_registry: https://registry.npmjs.org/
          npm_config_fetch_retries: 3
          npm_config_fetch_retry_factor: 2
          npm_config_fetch_retry_mintimeout: 2000
          npm_config_fetch_retry_maxtimeout: 30000
          npm_config_fetch_timeout: 120000
        run: |
          npm config get registry
          # Playwright é opcional: os fluxos E2E continuam reprodutíveis localmente,
          # mas não bloqueiam lint/build em runners com proxy de pacotes restrito.
          npm ci --omit=optional --prefer-offline --no-audit --fund=false
      - name: Instalar bindings nativos usados por lint e build
        working-directory: frontend
        run: >
          npm install --omit=optional --no-save --no-package-lock
          @oxlint/binding-linux-x64-gnu@1.71.0
          @rolldown/binding-linux-x64-gnu@1.1.5
          lightningcss-linux-x64-gnu@1.32.0
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build de produção
        working-directory: frontend
        run: npm run build
